name: Data contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate_content
      - run: python -m scripts.validate_content --require-review-ready
      - run: python -m scripts.run_contract_evals
      - run: python -m scripts.check_stage1
      - run: python -m scripts.check_stage2
      - run: python -m scripts.run_journey_evals
      - run: python -m scripts.check_stage3_ui
      - run: python -m scripts.check_stage3
      - run: python -m scripts.check_stage4_readiness
      - run: python -m scripts.check_stage4_ui
      - run: python -m scripts.check_stage4
      # Release readiness is intentionally a separate gate: draft shells must
      # remain legal during authoring. Unit tests verify release fails closed.

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Verify exact upgrade from the deployed Stage 3 exit
        run: |
          pnpm exec supabase db reset --local --version 20260911001000
          docker exec -i supabase_db_nestline psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/fixtures/stage4_legacy_upgrade.sql
          pnpm exec supabase migration up --local
          docker exec -i supabase_db_nestline psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/fixtures/stage4_legacy_upgrade_check.sql
          for test_file in supabase/tests/*.test.sql; do pnpm exec supabase test db --local "$test_file"; done
          set -a
          eval "$(pnpm exec supabase status -o env)"
          set +a
          python -m scripts.check_stage2_storage_api
          python -m scripts.check_stage3_onboarding_api
          python -m scripts.check_stage4_document_api
          pnpm exec supabase db lint --local
      - name: Verify a clean installation
        run: |
          pnpm exec supabase db reset --local
          for test_file in supabase/tests/*.test.sql; do pnpm exec supabase test db --local "$test_file"; done
          set -a
          eval "$(pnpm exec supabase status -o env)"
          set +a
          python -m scripts.check_stage2_storage_api
          python -m scripts.check_stage3_onboarding_api
          python -m scripts.check_stage4_document_api
          pnpm exec supabase db lint --local
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
